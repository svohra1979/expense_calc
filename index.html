<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple expense tracker with category and month filters, saved in your browser.">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Expense Tracker</h1>
    <p>Track spending by category and month</p>
  </header>

  <main>
    <section id="formSection" aria-label="Add expense">
      <input type="text" id="descInput" placeholder="Description" aria-label="Description">
      <input type="number" id="amountInput" placeholder="Amount" min="0" step="0.01" aria-label="Amount">
      <select id="categoryInput" aria-label="Category">
        <option value="food">Food</option>
        <option value="travel">Travel</option>
        <option value="shopping">Shopping</option>
        <option value="other">Other</option>
      </select>
      <input type="date" id="dateInput" aria-label="Date">
      <button id="addBtn">Add Expense</button>
      <p id="errorMsg" role="alert"></p>
    </section>

    <section id="summarySection" aria-label="Summary">
      <div class="summary-card"><h3>Total</h3><p id="totalSpent"></p></div>
      <div class="summary-card"><h3>Count</h3><p id="expenseCount"></p></div>
      <div class="summary-card"><h3>Top Category</h3><p id="topCategory"></p></div>
    </section>

    <section id="filterSection" aria-label="Filters">
      <button data-category="all">All</button>
      <button data-category="food">Food</button>
      <button data-category="travel">Travel</button>
      <button data-category="shopping">Shopping</button>
      <button data-category="other">Other</button>
      <input type="month" id="monthInput" aria-label="Filter by month">
    </section>

    <section id="expenseList" aria-label="Expenses"></section>
  </main>

  <footer>Data is stored in your browser (localStorage).</footer>

  <script src="script.js"></script>
</body>
</html>
